name: 📱 Compilar APK Android

on:
  push:
    branches: [ main ]
  # También se puede disparar manualmente desde la pestaña "Actions" de GitHub
  workflow_dispatch:

jobs:
  build-apk:
    name: 🔨 Compilar y Publicar APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ── 1. Descargar el código ──────────────────────────────────────────────
      - name: 📥 Descargar Código
        uses: actions/checkout@v4

      # ── 2. Configurar Node.js ───────────────────────────────────────────────
      - name: 🟢 Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Instalar dependencias ────────────────────────────────────────────
      - name: 📦 Instalar Dependencias npm
        run: npm ci

      # ── 4. Verificar tipos TypeScript ───────────────────────────────────────
      - name: 🔍 Verificar Tipos TypeScript
        run: npx tsc --noEmit
        continue-on-error: true   # No bloquea el build por warnings de tipos

      # ── 5. Compilar activos web con Vite ────────────────────────────────────
      - name: 🏗️ Compilar Web (Vite Build)
        run: npm run build

      # ── 6. Configurar Java 21 (requerido por Gradle/Android/Capacitor 6) ────
      - name: ☕ Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # ── 7. Configurar Android SDK ───────────────────────────────────────────
      - name: 🤖 Configurar Android SDK
        uses: android-actions/setup-android@v3

      # ── 8. Sincronizar activos web con el proyecto Android nativo ───────────
      - name: 🔄 Sincronizar Activos Capacitor (cap sync)
        run: npx cap sync android

      # ── 9. Compilar el APK con Gradle ───────────────────────────────────────
      - name: 📱 Compilar APK Debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # ── 10. Subir el APK como artefacto descargable del build ───────────────
      - name: ☁️ Publicar APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: DeTodito-APK-Debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── 11. Publicar Release 'latest' en GitHub Releases ───────────────────
      - name: 🏷️ Publicar Release 'latest' en GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "latest"
          name: "DeTodito APK (Última versión)"
          body: |
            ## 📱 DeTodito - Última compilación de la aplicación
            APK compilado automáticamente por GitHub Actions.
            - **Build:** #${{ github.run_number }}
            - **Commit:** ${{ github.sha }}
            - **Fecha:** ${{ github.event.head_commit.timestamp }}
          files: android/app/build/outputs/apk/debug/app-debug.apk



