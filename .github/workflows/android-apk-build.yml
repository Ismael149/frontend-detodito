name: 📱 Compilar APK Android

on:
  push:
    branches: [ main ]
  # También se puede disparar manualmente desde la pestaña "Actions" de GitHub
  workflow_dispatch:

jobs:
  build-apk:
    name: 🔨 Compilar y Publicar APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Descargar el código ──────────────────────────────────────────────
      - name: 📥 Descargar Código
        uses: actions/checkout@v4

      # ── 2. Configurar Node.js ───────────────────────────────────────────────
      - name: 🟢 Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Instalar dependencias ────────────────────────────────────────────
      - name: 📦 Instalar Dependencias npm
        run: npm ci

      # ── 4. Verificar tipos TypeScript ───────────────────────────────────────
      - name: 🔍 Verificar Tipos TypeScript
        run: npx tsc --noEmit
        continue-on-error: true   # No bloquea el build por warnings de tipos

      # ── 5. Compilar activos web con Vite ────────────────────────────────────
      - name: 🏗️ Compilar Web (Vite Build)
        run: npm run build

      # ── 6. Configurar Java 17 (requerido por Gradle/Android) ────────────────
      - name: ☕ Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # ── 7. Configurar Android SDK ───────────────────────────────────────────
      - name: 🤖 Configurar Android SDK
        uses: android-actions/setup-android@v3

      # ── 8. Sincronizar activos web con el proyecto Android nativo ───────────
      - name: 🔄 Sincronizar Activos Capacitor (cap sync)
        run: npx cap sync android

      # ── 9. Compilar el APK con Gradle ───────────────────────────────────────
      - name: 📱 Compilar APK Debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # ── 10. Subir el APK como artefacto descargable del build ───────────────
      - name: ☁️ Publicar APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: DeTodito-APK-Debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── 11. Crear un Release automático si el push tiene un tag v* ──────────
      - name: 🏷️ Crear Release si hay tag de versión
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: "DeTodito ${{ github.ref_name }}"
          body: |
            ## 📱 Nueva versión de DeTodito
            APK compilado automáticamente por GitHub Actions.
            **Commit:** ${{ github.sha }}
            **Fecha:** ${{ github.event.head_commit.timestamp }}
