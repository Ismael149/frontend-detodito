name: 📱 Compilar APK Android

on:
  push:
    branches: [ main ]
  # También se puede disparar manualmente desde la pestaña "Actions" de GitHub
  workflow_dispatch:

jobs:
  build-apk:
    name: 🔨 Compilar y Publicar APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ── 1. Descargar el código ──────────────────────────────────────────────
      - name: 📥 Descargar Código
        uses: actions/checkout@v4

      # ── 2. Configurar Node.js ───────────────────────────────────────────────
      - name: 🟢 Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Instalar dependencias ────────────────────────────────────────────
      - name: 📦 Instalar Dependencias npm
        run: npm ci

      # ── 4. Verificar tipos TypeScript ───────────────────────────────────────
      - name: 🔍 Verificar Tipos TypeScript
        run: npx tsc --noEmit
        continue-on-error: true   # No bloquea el build por warnings de tipos

      # ── 5. Compilar activos web con Vite ────────────────────────────────────
      - name: 🏗️ Compilar Web (Vite Build)
        run: npm run build

      # ── 6. Configurar Java 21 (requerido por Gradle/Android/Capacitor 6) ────
      - name: ☕ Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # ── 7. Configurar Android SDK (usando el preinstalado en el runner) ─────
      - name: 🤖 Configurar Android SDK
        run: |
          echo "SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      # ── 8. Sincronizar activos web con el proyecto Android nativo ───────────
      - name: 🔄 Sincronizar Activos Capacitor (cap sync)
        run: npx cap sync android

      # ── 9. Compilar el APK con Gradle ───────────────────────────────────────
      - name: 📱 Compilar APK Debug
        working-directory: android
        env:
          ANDROID_SDK_ROOT: ${{ env.SDK_ROOT }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # ── 10. Subir el APK como artefacto descargable del build ───────────────
      - name: ☁️ Publicar APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: DeTodito-APK-Debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── 11. Publicar Release 'latest' en GitHub Releases (repo actual) ──────
      - name: 🏷️ Publicar Release 'latest' en GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "latest"
          name: "DeTodito APK (Última versión)"
          body: |
            ## 📱 DeTodito - Última compilación de la aplicación
            APK compilado automáticamente por GitHub Actions.
            - **Build:** #${{ github.run_number }}
            - **Commit:** ${{ github.sha }}
            - **Fecha:** ${{ github.event.head_commit.timestamp }}
          files: android/app/build/outputs/apk/debug/app-debug.apk

      # ── 12. Subir el APK al repositorio detodito-apk-releases ───────────────
      - name: 📤 Publicar APK en repositorio detodito-apk-releases
        env:
          APK_DEPLOY_TOKEN: ${{ secrets.APK_DEPLOY_TOKEN }}
        run: |
          # Configurar git con el token
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"

          # Clonar el repositorio de releases
          git clone "https://x-access-token:${APK_DEPLOY_TOKEN}@github.com/Ismael149/detodito-apk-releases.git" apk-repo
          cd apk-repo

          # Copiar el APK con nombre de versión y con nombre fijo "latest"
          cp "../android/app/build/outputs/apk/debug/app-debug.apk" "DeTodito-Build-${{ github.run_number }}.apk"
          cp "../android/app/build/outputs/apk/debug/app-debug.apk" "DeTodito-Latest.apk"

          # Actualizar README con info del último build
          cat > README.md << 'EOF'
          # 📱 DeTodito - APK Releases

          Aquí encontrarás las versiones compiladas automáticamente de la app **DeTodito**.

          ## ⬇️ Descargar última versión

          👉 **[DeTodito-Latest.apk](./DeTodito-Latest.apk)**

          ## 📋 Historial de builds

          | Build | Archivo | Commit |
          |-------|---------|--------|
          | #${{ github.run_number }} | DeTodito-Build-${{ github.run_number }}.apk | ${{ github.sha }} |

          > Compilado automáticamente por GitHub Actions desde [frontend-detodito](https://github.com/Ismael149/frontend-detodito)
          EOF

          # Subir al repositorio
          git add -A
          git commit -m "🤖 APK Build #${{ github.run_number }} - $(date +'%Y-%m-%d %H:%M')"
          git push origin main
